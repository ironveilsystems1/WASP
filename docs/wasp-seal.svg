  <!-- Product mark: a second, narrower banner beneath the company one.
       Subordinate by width and position, so the hierarchy reads correctly —
       IronVeil vouches for WASP, not the reverse.
       Sized to sit inside the circle: at y=328 the ring's half-width is ~119,
       so a 180-wide plate centred on 340 clears it with room either side. The
       expanded name is deliberately omitted — it measured ~279px, wider than
       the circle at that height, and a seal does not need to explain itself. -->
