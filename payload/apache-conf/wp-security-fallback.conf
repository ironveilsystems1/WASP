# Fallback Apache security config — no wp-admin IP restriction.
ServerTokens Prod
ServerSignature Off
CustomLog /var/log/apache2/access.log combined
# v7-14: the dual-IP remoteip-debug log is deliberately NOT enabled here.
# This fallback only runs when the host-generated config is missing, which
# means no PROXY_IP was baked in, which means peer and interpreted address
# are identical by definition — a second log line per request proving
# nothing, at the cost of doubling log volume.
<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride All
</Directory>
<FilesMatch "(wp-config\.php|readme\.html|license\.txt)$">
    Require all denied
</FilesMatch>
<FilesMatch "\.(bak|orig|sql|log|sh|swp|save)$">
    Require all denied
</FilesMatch>
<DirectoryMatch "^/var/www/html/wp-content/uploads">
    <FilesMatch "\.ph(p[0-9]?|tml)$">
        Require all denied
    </FilesMatch>
</DirectoryMatch>
<Files "xmlrpc.php">
    Require all denied
</Files>
<Files "debug.log">
    Require all denied
</Files>
<IfModule mod_rewrite.c>
    RewriteEngine On
    RewriteCond %{QUERY_STRING} author=
    RewriteRule ^ - [F,L]
</IfModule>
Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "SAMEORIGIN"
Header always set Referrer-Policy "strict-origin-when-cross-origin"
Header always unset X-Powered-By
# FORENSIC FIX (new-audit High finding, confirmed accurate): the CSP used
# to allow 'unsafe-eval' site-wide. It's genuinely needed for wp-admin (the
# block editor's bundled JS uses eval() in places) but the public-facing
# site rarely does — most themes need 'unsafe-inline' (inline critical CSS,
# small inline scripts) but not eval(). Site-wide default now drops
# unsafe-eval; the LocationMatch below adds it back ONLY for wp-admin and
# the login page, where it's actually required. If your theme's front end
# specifically needs eval() (uncommon), add it back to the default line.
Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; frame-ancestors 'self'"
Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()"
<LocationMatch "^/(wp-admin/|wp-login\.php)">
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; frame-ancestors 'self'"
</LocationMatch>
