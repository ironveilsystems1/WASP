; WordPress PHP Security Configuration
expose_php = Off
display_errors = Off
log_errors = On
error_log = /var/log/apache2/php-errors.log
; allow_url_fopen: ON for MSP production.
; WordPress core uses cURL (not fopen) for HTTP, but many WooCommerce payment
; gateways and plugin APIs use file_get_contents() with URLs. Disabling breaks
; those integrations. Restrict at the nftables output chain if tighter control
; is needed. Flip to Off only for high-security environments with no plugins.
allow_url_fopen = On
allow_url_include = Off

; ── Process-execution functions ──────────────────────────────────────────────
; The single highest-value line in this file. Nearly every off-the-shelf PHP
; webshell -- c99, r57, WSO, and the hundreds of variants that get dropped
; through a vulnerable plugin -- reaches for system(), shell_exec() or exec()
; within its first few lines. Disabling them does not stop a determined
; attacker writing a bespoke shell, but it breaks the commodity ones outright,
; and commodity is what actually lands on a WordPress site.
;
; WordPress core needs NONE of these. What can need them:
;   - image optimisation plugins that shell out to jpegoptim/pngquant
;   - some backup plugins that call mysqldump or tar directly
;   - a handful of "system info" and server-status plugins
;
; If a plugin breaks with "call to undefined function", this is why. The fix
; is to decide whether that plugin is worth the exposure -- usually the answer
; is to find one that uses PHP rather than shelling out. Toggle it with:
;   doas wp-hardening.sh disable php-exec      (allow them again)
;   doas wp-hardening.sh enable  php-exec      (block them)
;
; proc_open and popen are included because they are the usual fallbacks once
; system() is gone; leaving them is most of the way to leaving all of it.
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,proc_nice,proc_terminate,proc_get_status,proc_close,pcntl_exec,dl
; ── CVE-2026-109618 / CVE-2026-109619 (PHP core, patched 21 October 2026) ────
; Two critical unauthenticated remote code execution flaws in PHP core, known
; publicly as "php2shell". Both are reachable over plain HTTP with no
; credentials and execute as the web worker.
;
; THE FIX IS THE PHP VERSION, NOT THIS FILE. Fixed releases are 8.2.35,
; 8.3.36, 8.4.27 and 8.5.12. Nothing below neutralises 109618; what is here
; removes the default trigger for 109619 and reduces the surface for both.
; Treat these as what they are -- a hedge for the window before a patched
; image is pulled, not a substitute for pulling one.
;
; This stack is in the highest-risk configuration upstream identifies: the
; official WordPress image serves through Apache with mod_php, where 109618
; can be reached BEFORE any application code runs. No WordPress hardening,
; mu-plugin or allow list sits in front of that.
;
; session.upload_progress is enabled by default and is the documented trigger
; for 109619 -- a use-after-free where state left by a fatal error or timeout
; is read by a later request on the same worker. WordPress core does not use
; it; a small number of upload-progress-bar plugins do, and they degrade to no
; progress bar rather than breaking.
;
; It must be set HERE rather than by the application: ini_set() and .user.ini
; both run too late to matter.
session.upload_progress.enabled = Off

; Not applied here, deliberately, and recorded so the decision is visible:
;
;   memory_limit = -1  is listed upstream as a mitigation for 109618, because
;   the flaw lives in the out-of-memory handling path. Removing PHP's
;   per-request memory cap on a shared virtualisation host trades a
;   hard-to-exploit RCE for an easy denial of service against every other
;   guest. Patch instead.
;
;   post_max_size = 8M  is the upstream recommendation (32M where uploads are
;   needed). 64M is kept because WordPress media libraries routinely exceed
;   32M and silently breaking a client's uploads is a poor trade for a partial
;   mitigation. Lower it per-site if that site does not need large uploads.

; File upload limits
upload_max_filesize = 64M
post_max_size = 64M
; Runtime limits
memory_limit = 256M
max_execution_time = 300
; Session security — Lax (not Strict) for WordPress OAuth and payment flows.
; Strict breaks SSO callbacks, WooCommerce, and any cross-origin POST redirect.
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1
