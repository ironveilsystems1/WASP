; WordPress PHP Security Configuration
expose_php = Off
display_errors = Off
log_errors = On
error_log = /var/log/apache2/php-errors.log
; allow_url_fopen: ON for MSP production.
; WordPress core uses cURL (not fopen) for HTTP, but many WooCommerce payment
; gateways and plugin APIs use file_get_contents() with URLs. Disabling breaks
; those integrations. Restrict at the nftables output chain if tighter control
; is needed. Flip to Off only for high-security environments with no plugins.
allow_url_fopen = On
allow_url_include = Off

; ── Process-execution functions ──────────────────────────────────────────────
; The single highest-value line in this file. Nearly every off-the-shelf PHP
; webshell -- c99, r57, WSO, and the hundreds of variants that get dropped
; through a vulnerable plugin -- reaches for system(), shell_exec() or exec()
; within its first few lines. Disabling them does not stop a determined
; attacker writing a bespoke shell, but it breaks the commodity ones outright,
; and commodity is what actually lands on a WordPress site.
;
; WordPress core needs NONE of these. What can need them:
;   - image optimisation plugins that shell out to jpegoptim/pngquant
;   - some backup plugins that call mysqldump or tar directly
;   - a handful of "system info" and server-status plugins
;
; If a plugin breaks with "call to undefined function", this is why. The fix
; is to decide whether that plugin is worth the exposure -- usually the answer
; is to find one that uses PHP rather than shelling out. Toggle it with:
;   doas wp-hardening.sh disable php-exec      (allow them again)
;   doas wp-hardening.sh enable  php-exec      (block them)
;
; proc_open and popen are included because they are the usual fallbacks once
; system() is gone; leaving them is most of the way to leaving all of it.
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,proc_nice,proc_terminate,proc_get_status,proc_close,pcntl_exec,dl
; File upload limits
upload_max_filesize = 64M
post_max_size = 64M
; Runtime limits
memory_limit = 256M
max_execution_time = 300
; Session security — Lax (not Strict) for WordPress OAuth and payment flows.
; Strict breaks SSO callbacks, WooCommerce, and any cross-origin POST redirect.
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1
