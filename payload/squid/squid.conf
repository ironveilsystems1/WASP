# =============================================================================
# WASP egress proxy — Squid policy
# =============================================================================
# Forward proxy only. No caching, no TLS interception, internal listener,
# default deny.
#
# HOW HTTPS IS FILTERED WITHOUT DECRYPTING ANYTHING
#
# A client opening an HTTPS connection through a proxy sends
#     CONNECT api.wordpress.org:443 HTTP/1.1
# in PLAINTEXT before any TLS handshake. `dstdomain` matches on that, so
# destination allowlisting works with no SSL Bump, no certificate authority
# on the VM, and no ability to read the traffic. Content is never inspected —
# only where a connection is going.
#
# The cost of that choice, stated because it is the boundary of what this
# control does: an approved destination that is itself compromised is still
# reachable, and data can still leave through an allowed host. This limits
# WHERE traffic can go, not what it carries.
#
# EVALUATION ORDER is the security property. Each stage answers one question:
#   1. source        is this even our WordPress container?
#   2. method/port   is this a shape of request we permit at all?
#   3. hard deny     is this destination categorically unacceptable?
#   4. IP literal    is this an attempt to skip name-based policy?
#   5. threat list   is this destination known to be dangerous?
#   6. runtime allow is this intentionally required?
#   7. maintenance   is this temporarily permitted, with an expiry?
#   8. deny all      nothing approved it
#
# Order matters and is not cosmetic: a hard deny placed after the allowlist
# could be overridden by an allowlist entry, which is how a metadata endpoint
# ends up reachable because someone allowlisted a wildcard.
# =============================================================================

# ── 1. Source ────────────────────────────────────────────────────────────────
# Only the WordPress container network. Not the host, not wp-db, not anything
# else that might later share the bridge.
acl wp_front src 10.89.10.0/24
http_access deny !wp_front

# ── 2. Methods and ports ─────────────────────────────────────────────────────
acl SSL_ports port 443
acl Safe_ports port 80 443
acl CONNECT method CONNECT
# CONNECT MUST BE HERE. Every HTTPS request through a forward proxy is a
# CONNECT, so omitting it denied ALL TLS traffic at the `deny !allowed_methods`
# line below -- before the allowlist further down was ever consulted. The
# symptom on a real VM was `TCP_DENIED/403 api.wordpress.org:443` in Squid's
# access log, a plugin install failing with "something may be wrong with
# WordPress.org", and an egress self-test in which every deny-probe "passed"
# because everything was being denied.
#
# CONNECT is NOT thereby unrestricted: `http_access deny CONNECT !SSL_ports`
# a few lines down confines it to port 443, which is the control that actually
# matters -- it stops CONNECT being used to tunnel to arbitrary ports.
acl allowed_methods method GET POST HEAD OPTIONS PUT CONNECT

http_access deny !allowed_methods
http_access deny !Safe_ports
# CONNECT to anything other than 443 is a tunnel to a non-HTTPS service, which
# is how a proxy gets used to reach SSH, SMTP or a database somewhere else.
http_access deny CONNECT !SSL_ports

# CVE-2025-54574 — heap buffer overflow in URN handling, remote code
# execution, all versions before 6.4. WordPress never requests a urn: URI.
#
# CVE-2026-47729 — out-of-bounds read in the FTP gateway, leaking data from
# other sessions. Nothing here proxies FTP.
#
# These sit HERE, in the deny stack, and not with the other CVE mitigations
# further down. Placed after the allowlist they would never be reached: an
# allowed source requesting a urn: URI would match `http_access allow` first
# and the deny would be decorative. Written in the wrong place initially, and
# caught only by re-reading the rendered order — which is the same class of
# mistake the ordering comment at the top of this file warns about.
acl URN proto URN
http_access deny URN
acl FTP proto FTP
http_access deny FTP

# ── 3. Hard destination deny ─────────────────────────────────────────────────
# Categorically unacceptable, regardless of any allowlist below.
#
# The metadata address is listed as an IP and not only as a hostname: the
# security property has to survive a request straight to 169.254.169.254,
# which is exactly what SSRF payloads do.
acl hard_deny_dst dst "/etc/squid/hard-deny.txt"
http_access deny hard_deny_dst

# Also deny by name, for the cases where a hostname resolves into a private
# range — DNS rebinding aimed at reaching the LAN through the proxy.
acl metadata_names dstdomain metadata.google.internal metadata.goog
http_access deny metadata_names

# ── 4. IP literals ───────────────────────────────────────────────────────────
# A request to a bare address bypasses every name-based rule below it. There
# is no legitimate WordPress update or API call that needs one.
acl ip_literal dstdom_regex ^([0-9]{1,3}\.){3}[0-9]{1,3}$
acl ip6_literal dstdom_regex ^\[?[0-9a-fA-F:]+\]?$
http_access deny ip_literal
http_access deny ip6_literal

# ── 5. Threat blocklist ──────────────────────────────────────────────────────
# Applied BEFORE the allowlist deliberately. If a destination appears on both,
# the deny wins — an allowlist entry should not be able to re-enable something
# a threat feed has flagged, and the collision is worth an operator's
# attention rather than a silent resolution in favour of access.
acl threat_deny dstdomain "/etc/squid/threat-deny.txt"
http_access deny threat_deny

# ── 6. Runtime allowlist ─────────────────────────────────────────────────────
acl runtime_allow dstdomain "/etc/squid/allowlist-runtime.txt"
http_access allow wp_front runtime_allow

# ── 7. Maintenance allowlist ─────────────────────────────────────────────────
# Written by `wasp-egress maintenance enable` and emptied on expiry. Empty in
# STRICT mode, which is the normal state.
acl maint_allow dstdomain "/etc/squid/allowlist-maintenance.txt"
http_access allow wp_front maint_allow

# ── 8. Default deny ──────────────────────────────────────────────────────────
http_access deny all

# ── Listener ─────────────────────────────────────────────────────────────────
# Bound to the container network only. Never the WAN interface: a proxy
# reachable from the internet is an open relay, and open proxies are found by
# scanners within hours.
http_port 3128

# ── Caching: off ─────────────────────────────────────────────────────────────
# This is a policy enforcement point, not a cache. Caching would add a store
# of other people's content, disk growth to manage, and a class of
# cache-poisoning bugs, for no benefit here.
cache deny all
# NO cache_dir line, deliberately.
#
# This used to say `cache_dir null /tmp`. It was removed on the theory that the
# `null` store type is not built into Debian/Ubuntu's squid and was causing a
# parse failure. THAT THEORY WAS WRONG -- the real cause was an overlapping
# dstdomain entry in allowlist-runtime.txt, which the container's own log named
# once the diagnostics captured it.
#
# The removal is kept anyway, on its own merits and not as a fix: `cache deny
# all` directly above already means nothing is ever cached, so a cache_dir line
# was redundant, and omitting it leaves squid memory-only and parsing cleanly
# on any build. Recorded honestly because a comment claiming to have fixed
# something it did not fix is how the next person wastes a day.
cache_mem 16 MB

# ── ICMP pinger: off ─────────────────────────────────────────────────────────
# The pinger is a helper that measures ICMP round-trip times to choose between
# CACHE PEERS. There are no peers here -- this is a single forward proxy -- so
# it has nothing to measure. It also cannot work: raw ICMP sockets need
# CAP_NET_RAW, and this container runs --cap-drop ALL by design.
#
# Left enabled it logs, on every start:
#     pinger| Open icmp_sock: (1) Operation not permitted
#     pinger| FATAL: Unable to open any ICMP sockets.
#
# Squid itself carries on serving perfectly -- that FATAL belongs to the pinger
# process, not to Squid -- but a config whose normal state includes the word
# FATAL is one where a real fatal error goes unread. Observed exactly that: an
# operator reasonably read it as Squid failing while the access log showed it
# tunnelling traffic and enforcing the allowlist in the same second.
pinger_enable off
cache_store_log none
cache_log /var/log/squid/cache.log

# ── Logging ──────────────────────────────────────────────────────────────────
# Denials are the interesting record: they are how the allowlist gets built
# during discovery and how an attempted egress is noticed afterwards.
logformat wasp %ts.%03tu %6tr %>a %Ss/%03>Hs %<st %rm %ru %Sh/%<a %mt
access_log /var/log/squid/access.log wasp

# ── Known-CVE hardening ──────────────────────────────────────────────────────
# Squid has a history of parser and error-handling flaws. Each of these
# disables a feature this deployment does not use and which has carried a
# published vulnerability. Disabling unused protocol handlers is worth doing
# regardless of patch level: the next flaw in an unused parser is one this
# configuration is already immune to.

# CVE-2025-62168 (CVSS 10.0) — HTTP credentials were not redacted from error
# pages, letting a remote client harvest tokens used by backend applications.
# Fixed upstream in 7.2 and BACKPORTED by Canonical into 6.13-1ubuntu1.2;
# this is the vendor's documented workaround and costs
# nothing, since nobody is emailing this proxy's error diagnostics anywhere.
email_err_data off

# CVE-2026-50012 — heap overflow via crafted cache_digest replies. This proxy
# does not cache and has no peers, so digests have no purpose here.
digest_generation off

# No ICP, HTCP, SNMP or peers: nothing that makes this a participant in a
# hierarchy, and each is a parser that would otherwise be reachable.
icp_port 0
htcp_port 0
snmp_port 0

# ── Hygiene ──────────────────────────────────────────────────────────────────
# Do not advertise the proxy, its version, or the client's address onward.
# `via off` makes Squid omit the Via header. This DOES produce
# "WARNING: HTTP requires the use of Via" on every parse, and that warning is
# correct -- RFC 9110 does expect it. The trade is deliberate: Via advertises
# that a proxy is present and which one, which is free reconnaissance for
# anything probing the egress path. Keep it off; the warning is expected and
# is not a misconfiguration.
via off
forwarded_for delete
httpd_suppress_version_string on
request_header_access X-Forwarded-For deny all

# Conservative timeouts: a hung upstream should not hold a WordPress worker.
connect_timeout 15 seconds
read_timeout 60 seconds
request_timeout 30 seconds
client_lifetime 1 hour

# Squid's default shutdown_lifetime is 30 seconds -- it waits that long for
# active client connections to finish. Podman's default stop timeout is 10, so
# every `podman restart squid` ended in SIGKILL:
#   WARN StopSignal SIGTERM failed to stop container squid in 10 seconds,
#        resorting to SIGKILL
# Nothing is corrupted by that (Squid holds no persistent state here, and
# caching is off), but a SIGKILL can truncate the access log mid-line, and the
# access log is the evidence that diagnosed the CONNECT bug. Five seconds is
# ample for a proxy serving one container.
shutdown_lifetime 5 seconds

# DNS: resolve v4 first and do not follow a name into a private range. The
# hard_deny_dst ACL above catches the result regardless, but failing early is
# cheaper and clearer in the log.
# dns_v4_first was here. Squid 6 REMOVED it -- "Squid no longer supports
# preferential treatment of DNS A records" -- and emits an ERROR line for it on
# every single parse. That matters beyond tidiness: the production fail-closed
# check runs `squid -k parse`, and a config that always prints ERROR trains
# everyone to skim past the output, which is exactly where the next real
# problem will appear. Removed; Squid's default resolution order is fine.

# ── Resolvers, stated explicitly ─────────────────────────────────────────────
# Squid previously inherited the container's /etc/resolv.conf, which points at
# the podman gateway where aardvark-dns listens. Aardvark resolves CONTAINER
# names; forwarding external names onward depends on it being configured with
# upstream resolvers and working. When that link failed, Squid could not
# resolve anything, EVERY request failed, and the symptom was indistinguishable
# from a policy denial -- api.wordpress.org looked blocked, the plugin install
# failed with "something may be wrong with WordPress.org or this server's
# configuration", and the egress self-test reported the boundary not holding.
#
# Naming the resolvers removes that dependency. These are the servers the
# operator chose at install (Quad9 by default), substituted at provision time,
# and the firewall is opened to exactly these addresses on port 53 -- not to
# DNS generally, so the tunnel stays closed.
dns_nameservers WASP_DNS_SERVERS_PLACEHOLDER

# Squid's own error pages should not leak the internal topology.
error_directory /usr/share/squid/errors/en
